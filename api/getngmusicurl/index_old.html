<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
</head>
<body>
    <script>
        (async function() {
            const songID = new URLSearchParams(location.search).get('songID');
            if (!songID) return;
            
            const response = await fetch('https://www.boomlings.com/database/getGJSongInfo.php', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: new URLSearchParams({secret: 'Wmfd2893gb7', songID: songID})
            });
            
            const text = await response.text();
            if (text === '-1') return;
            
            const parts = text.split('~|~');
            const data = {};
            for (let i = 0; i < parts.length; i += 2) data[parts[i]] = parts[i+1];
            
            if (data['10']) location.href = data['10'];
        })();
    </script>
    <p>Loading...</p>
</body>
</html>
